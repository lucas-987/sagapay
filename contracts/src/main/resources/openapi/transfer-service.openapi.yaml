openapi: 3.1.0
info:
  title: P2 Transfer Orchestrator API
  version: 1.0.0
  description: >-
    Creation and tracking of P2P transfers. Orchestrated saga. RFC 9457 errors.
    Exposed via api-gateway under `/v1`.
servers:
  - url: https://api.p2.demo.example.com
security:
  - oidc: [transfers:write, transfers:read]

paths:
  /v1/transfers:
    post:
      operationId: createTransfer
      summary: Send money to a user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransferRequest' }
      responses:
        '202':
          description: transfer accepted (reservation in progress or done)
          content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } }
        '409':
          description: Idempotency-Key already seen — returns the existing transfer
          content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } }
        '422':
          $ref: '#/components/responses/Problem'   # INSUFFICIENT_FUNDS, RECIPIENT_NOT_FOUND
        '503':
          $ref: '#/components/responses/Problem'   # circuit breaker ledger
    get:
      operationId: listTransfers
      summary: My transfers
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [SENT, RECEIVED, ALL], default: ALL } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransferStatus' } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
                  nextCursor: { type: string, nullable: true }

  /v1/transfers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTransfer
      summary: Detail + saga timeline
      responses:
        '200':
          description: transfer
          content: { application/json: { schema: { $ref: '#/components/schemas/TransferDetail' } } }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/transfers/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: confirmBlockedTransfer
      summary: Confirm a BLOCKED transfer after verification (simulated 3-DS-like)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken]
              properties: { verificationToken: { type: string } }
      responses:
        '202':
          description: saga resumes
          content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } }
        '410': { description: confirmation window expired -> transfer FAILED }

  /v1/requests:
    post:
      operationId: createPaymentRequest
      summary: Request money from a contact
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromUserId, amount]
              properties:
                fromUserId: { type: string }
                amount: { $ref: '#/components/schemas/Money' }
                note: { type: string, maxLength: 200 }
      responses:
        '201':
          description: request created (notifies the contact)
          content:
            application/json:
              schema:
                type: object
                properties: { requestId: { type: string }, status: { type: string, enum: [PENDING, PAID, DECLINED, EXPIRED] } }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.demo.example.com/realms/demo/.well-known/openid-configuration

  schemas:
    Money:
      type: object
      required: [currency, amount]
      properties:
        currency: { type: string, examples: [EUR] }
        amount: { type: string, examples: ["80.00"] }
    TransferStatus:
      type: string
      enum: [INITIATED, RESERVED, SCREENING, CLEARED, POSTED, SETTLED, FAILED, BLOCKED, REVERSED]
    CreateTransferRequest:
      type: object
      required: [amount]
      properties:
        toUserId: { type: string, nullable: true }
        toHandle: { type: string, nullable: true, description: "alternative to toUserId, e.g. @alice" }
        amount: { $ref: '#/components/schemas/Money' }
        note: { type: string, maxLength: 200 }
      description: provide toUserId OR toHandle
    Transfer:
      type: object
      required: [id, senderId, amount, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        senderId: { type: string }
        recipientId: { type: string }
        recipientDisplayName: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        note: { type: string }
        status: { $ref: '#/components/schemas/TransferStatus' }
        riskTier: { type: string, enum: [LOW, MEDIUM, HIGH] }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SagaStep:
      type: object
      properties:
        at: { type: string, format: date-time }
        step: { type: string, examples: [RESERVE, SCREEN, POST, RELEASE, REVERSE] }
        outcome: { type: string, examples: [OK, RETRY, FAILED, COMPENSATED] }
        detail: { type: object, additionalProperties: true }
    TransferDetail:
      allOf:
        - $ref: '#/components/schemas/Transfer'
        - type: object
          properties:
            steps: { type: array, items: { $ref: '#/components/schemas/SagaStep' } }
            fraud:
              type: object
              nullable: true
              properties:
                decision: { type: string, enum: [CLEARED, FLAGGED] }
                score: { type: number }
                reasons: { type: array, items: { type: string } }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, examples: [INSUFFICIENT_FUNDS, RECIPIENT_NOT_FOUND] }
