spring.application.name=transfer-orchestrator
server.port=8082

# optional: don't fail startup if .env is missing (CI/prod get secrets another way).
spring.config.import=optional:file:../.env[.properties]

# Migration account (DDL owner). No default password: an absent value must fail
# startup loudly, not silently migrate with a guessable credential.
spring.flyway.url=jdbc:postgresql://localhost:5433/orchestrator_svc
spring.flyway.user=${SAGAPAY_DB_USERNAME:sagapay}
spring.flyway.password=${SAGAPAY_DB_PASSWORD}
spring.flyway.placeholders.orchestratorAppUsername=${ORCHESTRATOR_APP_USERNAME:orchestrator_app}
spring.flyway.placeholders.orchestratorAppPassword=${ORCHESTRATOR_APP_PASSWORD}

# App runtime account: restricted, no DDL rights.
spring.datasource.url=jdbc:postgresql://localhost:5433/orchestrator_svc
spring.datasource.username=${ORCHESTRATOR_APP_USERNAME:orchestrator_app}
spring.datasource.password=${ORCHESTRATOR_APP_PASSWORD}

spring.grpc.client.channel.ledger.target=${LEDGER_GRPC_TARGET:static://localhost:9091}

# Small window so a handful of failed calls is enough to open the circuit --
# reasonable for demo-scale traffic, not tuned for production volumes.
resilience4j.circuitbreaker.instances.ledger.sliding-window-size=5
resilience4j.circuitbreaker.instances.ledger.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ledger.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ledger.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ledger.permitted-number-of-calls-in-half-open-state=2

# Boot only exposes "health" on /actuator by default; other endpoints must be listed.
management.endpoints.web.exposure.include=health,prometheus
management.health.probes.enabled=true
# No OTLP collector runs locally yet — export just fails silently with a logged warning.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# always-on: no separate sampling-ratio property in this Boot version, and demo-scale
# traffic doesn't need one anyway.
management.opentelemetry.tracing.sampler=always-on
