spring.application.name=transfer-orchestrator
# Filled by Maven resource filtering; read by the shared logback configuration.
service.version=@project.version@
server.port=8082

# optional: don't fail startup if .env is missing (CI/prod get secrets another way).
spring.config.import=optional:file:../.env[.properties]

# Migration account (DDL owner). No default password: an absent value must fail
# startup loudly, not silently migrate with a guessable credential.
spring.flyway.url=jdbc:postgresql://localhost:5433/orchestrator_svc
spring.flyway.user=${SAGAPAY_DB_USERNAME:sagapay}
spring.flyway.password=${SAGAPAY_DB_PASSWORD}
spring.flyway.placeholders.orchestratorAppUsername=${ORCHESTRATOR_APP_USERNAME:orchestrator_app}
spring.flyway.placeholders.orchestratorAppPassword=${ORCHESTRATOR_APP_PASSWORD}

# App runtime account: restricted, no DDL rights.
spring.datasource.url=jdbc:postgresql://localhost:5433/orchestrator_svc
spring.datasource.username=${ORCHESTRATOR_APP_USERNAME:orchestrator_app}
spring.datasource.password=${ORCHESTRATOR_APP_PASSWORD}

spring.grpc.client.channel.ledger.target=${LEDGER_GRPC_TARGET:static://localhost:9091}
# The deadline also covers connecting, so a cold channel needs more headroom than
# steady-state calls.
ledger.grpc.deadline-ms=${LEDGER_GRPC_DEADLINE_MS:500}
ledger.rest.base-url=${LEDGER_REST_BASE_URL:http://localhost:8081}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
# Outbox rows already hold serialized JSON, sent as is.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer of payments.fraud.results. A new group starts from the beginning, so that no
# result published before the first start is skipped.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer

saga.reprise.grace-period-ms=${SAGA_REPRISE_GRACE_PERIOD_MS:5000}
saga.reprise.sweep-interval-ms=${SAGA_REPRISE_SWEEP_INTERVAL_MS:60000}
# Per kind of work and sweep: a long outage leaves a backlog the next sweeps take in turn.
saga.reprise.batch-size=${SAGA_REPRISE_BATCH_SIZE:100}
saga.deadline.sweep-interval-ms=${SAGA_DEADLINE_SWEEP_INTERVAL_MS:1000}
# Per waiting status and sweep: a long outage leaves a backlog the next sweeps take in turn.
saga.deadline.batch-size=${SAGA_DEADLINE_BATCH_SIZE:100}
saga.screening.timeout-ms=${SAGA_SCREENING_TIMEOUT_MS:10000}
# How long a blocked transfer waits for the sender, cut short when the transfer's reservation would
# expire first: past that date the ledger frees the hold on its own, and a sender who confirmed in
# time would find nothing left to post on.
saga.confirmation.window-ms=${SAGA_CONFIRMATION_WINDOW_MS:120000}
# Kept between the confirmation deadline and the expiry of the reservation: it covers the call that
# posts a confirmed transfer and the clock difference with the ledger, not an outage of the ledger.
saga.confirmation.reservation-margin-ms=${SAGA_CONFIRMATION_RESERVATION_MARGIN_MS:5000}

# The v0.1 stand-in for a one-time code sent to the sender. No default, like the passwords:
# an absent value must fail startup, not leave a guessable code.
sagapay.fraud.verification-code=${SAGAPAY_FRAUD_VERIFICATION_CODE}

outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:500}
outbox.batch-size=${OUTBOX_BATCH_SIZE:100}

kafka.retry.attempts=${KAFKA_RETRY_ATTEMPTS:3}
kafka.retry.interval-ms=${KAFKA_RETRY_INTERVAL_MS:1000}

# A small window, so a few failed calls open the circuit at low traffic.
resilience4j.circuitbreaker.instances.ledger.sliding-window-size=5
resilience4j.circuitbreaker.instances.ledger.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ledger.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ledger.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ledger.permitted-number-of-calls-in-half-open-state=2
# A rejection means the ledger answered: it must not count toward opening the circuit.
resilience4j.circuitbreaker.instances.ledger.ignore-exceptions=dev.treyer.sagapay.orchestrator.domain.LedgerRejectedException

# Tokens are checked against Keycloak's keys and issuer. The default is the Compose address, which
# is also the issuer the tokens carry whichever address they were fetched from.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://keycloak:8180/realms/sagapay}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://keycloak:8180/realms/sagapay/protocol/openid-connect/certs}

# Boot only exposes "health" on /actuator by default; other endpoints must be listed.
management.endpoints.web.exposure.include=health,prometheus
management.health.probes.enabled=true
# No OTLP collector runs locally yet — export just fails silently with a logged warning.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# always-on: this Boot version has no separate sampling-ratio property.
management.opentelemetry.tracing.sampler=always-on
