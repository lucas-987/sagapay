services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SAGAPAY_DB_USERNAME:-sagapay}
      POSTGRES_PASSWORD: ${SAGAPAY_DB_PASSWORD}
      POSTGRES_DB: ledger_svc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ leaves the container's own variable to the container, not to Compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ledger_svc"]
      interval: 5s
      timeout: 3s
      retries: 10

  ledger-accounts-service:
    build:
      context: ..
      dockerfile: ledger-accounts-service/Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      # `local` seeds the sample accounts; `local-noauth` opens REST and gRPC without credentials.
      # Without it, gRPC admits only the orchestrator's token, checked against the keys and issuer
      # below. The gRPC port is not published: only the services of this network reach it.
      SPRING_PROFILES_ACTIVE: local,local-noauth
      OAUTH2_ISSUER_URI: http://keycloak:8180/realms/sagapay
      OAUTH2_JWK_SET_URI: http://keycloak:8180/realms/sagapay/protocol/openid-connect/certs
      # Same DB as the postgres service above, addressed by its network hostname.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_svc
      SPRING_DATASOURCE_USERNAME: ${LEDGER_APP_USERNAME:-ledger_app}
      SPRING_DATASOURCE_PASSWORD: ${LEDGER_APP_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/ledger_svc
      SPRING_FLYWAY_USER: ${SAGAPAY_DB_USERNAME:-sagapay}
      SPRING_FLYWAY_PASSWORD: ${SAGAPAY_DB_PASSWORD}
      SPRING_FLYWAY_PLACEHOLDERS_LEDGERAPPUSERNAME: ${LEDGER_APP_USERNAME:-ledger_app}
      SPRING_FLYWAY_PLACEHOLDERS_LEDGERAPPPASSWORD: ${LEDGER_APP_PASSWORD}

  # Its own container rather than a second database on `postgres`: each service
  # owns its data store, and no multi-database init script is needed.
  postgres-orchestrator:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SAGAPAY_DB_USERNAME:-sagapay}
      POSTGRES_PASSWORD: ${SAGAPAY_DB_PASSWORD}
      POSTGRES_DB: orchestrator_svc
    ports:
      - "5433:5432"
    volumes:
      - pgdata-orchestrator:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d orchestrator_svc"]
      interval: 5s
      timeout: 3s
      retries: 10

  # KRaft mode, no ZooKeeper; the same image family as Testcontainers' KafkaContainer.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Topics are created by kafka-init, never on first publish.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # A single broker: the internal topics cannot keep their default of three replicas, and
      # without __consumer_offsets no consumer group ever gets a coordinator.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Creates the topics, then exits.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in payments.transfers payments.fraud.results payments.transfers.DLT payments.fraud.results.DLT; do
          partitions=6
          case "$$topic" in *.DLT) partitions=1 ;; esac
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions "$$partitions" --replication-factor 1
        done
        echo "topics created"

  transfer-orchestrator:
    build:
      context: ..
      dockerfile: transfer-orchestrator/Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    depends_on:
      postgres-orchestrator:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      # The ledger runs with `local-noauth`, which opens its API; the gRPC calls carry the service
      # token below all the same.
      SPRING_PROFILES_ACTIVE: local
      # The address Keycloak's tokens name as issuer, which the stack resolves from every container.
      OAUTH2_ISSUER_URI: http://keycloak:8180/realms/sagapay
      OAUTH2_JWK_SET_URI: http://keycloak:8180/realms/sagapay/protocol/openid-connect/certs
      # The orchestrator's own credential for the ledger; no fallback, it does not start without them.
      # The secret and the bearer tokens travel over plain HTTP and gRPC here, which only a local
      # stack allows: anywhere else both need TLS.
      OAUTH2_TOKEN_URI: http://keycloak:8180/realms/sagapay/protocol/openid-connect/token
      ORCHESTRATOR_CLIENT_ID: ${ORCHESTRATOR_CLIENT_ID}
      ORCHESTRATOR_CLIENT_SECRET: ${ORCHESTRATOR_CLIENT_SECRET:?set ORCHESTRATOR_CLIENT_SECRET in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-orchestrator:5432/orchestrator_svc
      SPRING_DATASOURCE_USERNAME: ${ORCHESTRATOR_APP_USERNAME:-orchestrator_app}
      SPRING_DATASOURCE_PASSWORD: ${ORCHESTRATOR_APP_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres-orchestrator:5432/orchestrator_svc
      SPRING_FLYWAY_USER: ${SAGAPAY_DB_USERNAME:-sagapay}
      SPRING_FLYWAY_PASSWORD: ${SAGAPAY_DB_PASSWORD}
      SPRING_FLYWAY_PLACEHOLDERS_ORCHESTRATORAPPUSERNAME: ${ORCHESTRATOR_APP_USERNAME:-orchestrator_app}
      SPRING_FLYWAY_PLACEHOLDERS_ORCHESTRATORAPPPASSWORD: ${ORCHESTRATOR_APP_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_GRPC_CLIENT_CHANNEL_LEDGER_TARGET: static://ledger-accounts-service:9091
      LEDGER_REST_BASE_URL: http://ledger-accounts-service:8081
      # The deadline also covers connecting: the first call on a cold channel needs more than the 500 ms default.
      LEDGER_GRPC_DEADLINE_MS: ${LEDGER_GRPC_DEADLINE_MS:-5000}
      SAGAPAY_FRAUD_VERIFICATION_CODE: ${SAGAPAY_FRAUD_VERIFICATION_CODE}
      SAGA_CONFIRMATION_WINDOW_MS: ${SAGA_CONFIRMATION_WINDOW_MS:-120000}
      SAGA_SCREENING_TIMEOUT_MS: ${SAGA_SCREENING_TIMEOUT_MS:-10000}

  postgres-fraud:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SAGAPAY_DB_USERNAME:-sagapay}
      POSTGRES_PASSWORD: ${SAGAPAY_DB_PASSWORD}
      POSTGRES_DB: fraud_svc
    ports:
      - "5434:5432"
    volumes:
      - pgdata-fraud:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d fraud_svc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  fraud-detection-service:
    build:
      context: ..
      dockerfile: fraud-detection-service/Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    depends_on:
      postgres-fraud:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-fraud:5432/fraud_svc
      SPRING_DATASOURCE_USERNAME: ${FRAUD_APP_USERNAME:-fraud_app}
      SPRING_DATASOURCE_PASSWORD: ${FRAUD_APP_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres-fraud:5432/fraud_svc
      SPRING_FLYWAY_USER: ${SAGAPAY_DB_USERNAME:-sagapay}
      SPRING_FLYWAY_PASSWORD: ${SAGAPAY_DB_PASSWORD}
      SPRING_FLYWAY_PLACEHOLDERS_FRAUDAPPUSERNAME: ${FRAUD_APP_USERNAME:-fraud_app}
      SPRING_FLYWAY_PLACEHOLDERS_FRAUDAPPPASSWORD: ${FRAUD_APP_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  # The identity provider. Local only: start-dev, an embedded database and plain HTTP.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    # The sample users' passwords, which the realm file refers to by name. The path can be
    # overridden so that a test brings its own file.
    env_file:
      - ${KEYCLOAK_ENV_FILE:-./keycloak.env}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Read by the realm import as the secret of the orchestrator's client.
      ORCHESTRATOR_CLIENT_SECRET: ${ORCHESTRATOR_CLIENT_SECRET:?set ORCHESTRATOR_CLIENT_SECRET in .env}
      # One fixed public address, so a token carries the same issuer whether it was fetched
      # from the host (localhost:8180) or from inside the network (keycloak:8180). The port is
      # the same inside and outside for that reason.
      KC_HOSTNAME: http://keycloak:8180
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8180"
    healthcheck:
      # The image has no curl: read the readiness answer from the management port over bash's
      # /dev/tcp.
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/localhost/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  pgdata:
  pgdata-orchestrator:
  pgdata-fraud:
