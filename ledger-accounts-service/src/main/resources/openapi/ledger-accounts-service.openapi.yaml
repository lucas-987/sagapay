openapi: 3.1.0
info:
  title: SagaPay Ledger / Accounts API (read-only REST surface)
  version: 1.0.0
  description: >-
    Wallet reads (balance, available, postings). Money mutations go
    EXCLUSIVELY through gRPC (ledger.proto), never REST.
servers:
  - url: https://api.sagapay.treyer.dev
security:
  - oidc: []

paths:
  /v1/wallet:
    get:
      operationId: getWallet
      summary: My balance
      description: >-
        The wallet of the caller: the account is the subject of the bearer token,
        and a request cannot name another one.
      responses:
        '200':
          description: balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId: { type: string }
                  currency: { type: string }
                  balance: { $ref: '#/components/schemas/Money' }
                  available: { $ref: '#/components/schemas/Money' }
                  held: { $ref: '#/components/schemas/Money' }

  /v1/wallet/postings:
    get:
      operationId: listPostings
      summary: My ledger postings (append-only, cursor pagination)
      description: >-
        The postings of the caller's own account, taken from the subject of the
        bearer token, as on GET /v1/wallet.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: page of postings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Posting' }
                  nextCursor: { type: string, nullable: true }

  /v1/users/lookup:
    get:
      operationId: lookupAccount
      summary: Resolve a handle to an account (recipient preview before a transfer)
      description: >-
        Simplified subset of user-profile-service's lookupRecipient (see
        contracts/openapi-reference/user-profile-service.openapi.yaml), served by
        ledger-accounts-service because accounts already carry a handle and a
        display name. Exact handle match only; never returns balance or currency.
      parameters:
        - name: handle
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: account resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId: { type: string }
                  displayName: { type: string }
        '404':
          description: no account has this handle (code RECIPIENT_NOT_FOUND)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/users/names:
    get:
      operationId: lookupAccountNames
      summary: Display names of accounts, by id (counterparty names of a list)
      description: >-
        Answers the display name of each known account among at most 50 ids, in one
        request, for any signed-in user: the token's subject is not used. One item per
        known id, each id once even when repeated, in no guaranteed order; an unknown id
        is left out. Nothing else about an account is returned. At least one id and at
        most 50 are required, each a UUID, otherwise 400 with code INVALID_ACCOUNT_IDS.
      parameters:
        - name: ids
          in: query
          description: Account ids, the parameter repeated once per id (at most 50).
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        '200':
          description: names of the known accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccountName' }
        '400':
          description: no id, more than 50 ids, or an id that is not a UUID (code INVALID_ACCOUNT_IDS)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: no token, or a token the realm does not accept

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.sagapay.treyer.dev/realms/sagapay/.well-known/openid-configuration
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem document; code is the application error code.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
    AccountName:
      type: object
      required: [accountId, displayName]
      properties:
        accountId: { type: string, format: uuid }
        displayName: { type: string }
    Money:
      type: object
      properties: { currency: { type: string }, amount: { type: string } }
    Posting:
      type: object
      properties:
        id: { type: string }
        entryGroup: { type: string }
        leg: { type: string, enum: [DEBIT, CREDIT] }
        reason: { type: string, examples: [RESERVE_HOLD, RELEASE_HOLD, TRANSFER_SETTLE, TRANSFER_REVERSE] }
        amount: { $ref: '#/components/schemas/Money' }
        refTransferId: { type: string }
        createdAt: { type: string, format: date-time }
