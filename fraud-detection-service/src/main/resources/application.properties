spring.application.name=fraud-detection-service
server.port=8083

# optional: don't fail startup if .env is missing (CI/prod get secrets another way).
spring.config.import=optional:file:../.env[.properties]

# Migration account (DDL owner). No default password: an absent value must fail
# startup loudly, not silently migrate with a guessable credential.
spring.flyway.url=jdbc:postgresql://localhost:5434/fraud_svc
spring.flyway.user=${SAGAPAY_DB_USERNAME:sagapay}
spring.flyway.password=${SAGAPAY_DB_PASSWORD}
spring.flyway.placeholders.fraudAppUsername=${FRAUD_APP_USERNAME:fraud_app}
spring.flyway.placeholders.fraudAppPassword=${FRAUD_APP_PASSWORD}

# App runtime account: restricted, no DDL rights.
spring.datasource.url=jdbc:postgresql://localhost:5434/fraud_svc
spring.datasource.username=${FRAUD_APP_USERNAME:fraud_app}
spring.datasource.password=${FRAUD_APP_PASSWORD}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
# Outbox rows already hold serialized JSON, sent as is.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Boot only exposes "health" on /actuator by default; other endpoints must be listed.
management.endpoints.web.exposure.include=health,prometheus
management.health.probes.enabled=true
# No OTLP collector runs locally yet — export just fails silently with a logged warning.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# always-on: this Boot version has no separate sampling-ratio property.
management.opentelemetry.tracing.sampler=always-on

# Fraud rules: weights add up per rule that fires; at or above the flag threshold the transfer is flagged.
fraud.rules.velocity-1h.weight=${FRAUD_RULES_VELOCITY_1H_WEIGHT:0.40}
fraud.rules.velocity-1h.max-per-hour=${FRAUD_RULES_VELOCITY_1H_MAX_PER_HOUR:5}
fraud.rules.new-recipient.weight=${FRAUD_RULES_NEW_RECIPIENT_WEIGHT:0.35}
fraud.rules.amount-round.weight=${FRAUD_RULES_AMOUNT_ROUND_WEIGHT:0.35}
fraud.rules.amount-round.threshold=${FRAUD_RULES_AMOUNT_ROUND_THRESHOLD:500}
fraud.rules.flag-threshold=${FRAUD_RULES_FLAG_THRESHOLD:0.70}
fraud.rules.model-version=${FRAUD_RULES_MODEL_VERSION:rules-v1}
