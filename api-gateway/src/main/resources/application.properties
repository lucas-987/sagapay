spring.application.name=api-gateway
# Filled by Maven resource filtering; read by the shared logback configuration.
service.version=@project.version@

# Boot only exposes "health" on /actuator by default; other endpoints must be listed.
management.endpoints.web.exposure.include=health,prometheus
management.health.probes.enabled=true
# No OTLP collector runs locally yet — export just fails silently with a logged warning.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# always-on: this Boot version has no separate sampling-ratio property.
management.opentelemetry.tracing.sampler=always-on

server.port=8080

# The token is validated here, and the services validate it again: the routes add no filter that
# touches the Authorization header, so it reaches them as the client sent it.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://keycloak:8180/realms/sagapay}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://keycloak:8180/realms/sagapay/protocol/openid-connect/certs}

# A downstream that does not answer ends in a gateway error rather than a hanging call.
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:30s}

spring.cloud.gateway.server.webflux.routes[0].id=transfers
spring.cloud.gateway.server.webflux.routes[0].uri=${ORCHESTRATOR_URI:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/v1/transfers,/v1/transfers/**

spring.cloud.gateway.server.webflux.routes[1].id=ledger
spring.cloud.gateway.server.webflux.routes[1].uri=${LEDGER_URI:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/v1/wallet,/v1/wallet/**,/v1/users/**
